<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DuckDB-WASM 基准测试 · SpendCT</title>
  <style>
    /* 独立基准页：不依赖 Next，样式内联 */
    :root {
      --primary: #2e7ce8;
      --ok: #18a058;
      --fail: #d03050;
      --warn: #f0a020;
      --bg: #f7f9fc;
      --card: #ffffff;
      --border: #e3e8f0;
      --text: #1f2937;
      --muted: #6b7280;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px 16px 48px;
      background: var(--bg);
      color: var(--text);
      font-family: "Inter", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      line-height: 1.6;
    }
    main { max-width: 860px; margin: 0 auto; }
    h1 { font-size: 22px; margin: 0 0 4px; }
    .sub { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px 20px;
      margin-bottom: 16px;
    }
    .controls { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    button {
      border: none;
      border-radius: 8px;
      padding: 9px 18px;
      font-size: 14px;
      cursor: pointer;
      background: var(--primary);
      color: #fff;
    }
    button.secondary { background: #eef2f7; color: var(--text); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    select {
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fff;
      font-size: 14px;
    }
    table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
    th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-weight: 500; }
    td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
    .pass { color: var(--ok); font-weight: 600; }
    .fail { color: var(--fail); font-weight: 600; }
    .warn { color: var(--warn); font-weight: 600; }
    .hint { color: var(--muted); font-size: 12.5px; margin-top: 10px; }
    .note { font-size: 12.5px; color: var(--muted); }
    #export { margin-top: 12px; font-size: 13px; }
    pre {
      background: #101828;
      color: #d0d7e2;
      border-radius: 8px;
      padding: 12px 14px;
      font-size: 12px;
      overflow-x: auto;
      display: none;
    }
  </style>
</head>
<body>
<main>
  <h1>DuckDB-WASM 基准测试</h1>
  <p class="sub">
    与正式管线同源的加载路径（/duckdb/ 自托管产物），用于验证 06 路线图 §2.0 的 W1D1 指标：
    冷加载 &lt;4s、热加载 &lt;1.5s、1 万行导入+聚合 &lt;2s、内存 &lt;400MB。
  </p>

  <div class="card">
    <div class="controls">
      <label>数据规模
        <select id="rows">
          <option value="10000" selected>1 万行</option>
          <option value="50000">5 万行</option>
          <option value="100000">10 万行</option>
        </select>
      </label>
      <button id="run">开始测试</button>
      <button id="clear" class="secondary">清空重测</button>
      <span id="status" class="hint"></span>
    </div>
    <p class="note">
      首次访问即「冷加载」（wasm 从网络拉取）；保持本页刷新再测一次即为「热加载」
      （浏览器 HTTP 缓存命中，本页用 sessionStorage 记录上次耗时做对比）。
    </p>
  </div>

  <div class="card" id="result-card" style="display:none">
    <table>
      <thead>
        <tr>
          <th>阶段</th>
          <th class="num">耗时（ms）</th>
          <th class="num">阈值</th>
          <th class="num">判定</th>
        </tr>
      </thead>
      <tbody id="result-body"></tbody>
    </table>
    <button id="export" class="secondary">复制 JSON 结果</button>
    <pre id="export-json"></pre>
  </div>
</main>

<script type="importmap">
  {
    "imports": {
      "apache-arrow": "/duckdb/arrow/Arrow.mjs",
      "tslib": "/duckdb/tslib/tslib.es6.mjs",
      "flatbuffers": "/duckdb/flatbuffers/flatbuffers.js"
    }
  }
</script>
<script type="module">
  // 基准页从与正式版相同的 /duckdb/ 路径加载，避免两套产物、两套缓存。
  // duckdb-browser.mjs 对 apache-arrow 是裸模块引用，原生浏览器用 import map 解析
  import * as duckdb from "../../duckdb/duckdb-browser.mjs";

  const runBtn = document.getElementById("run");
  const clearBtn = document.getElementById("clear");
  const statusEl = document.getElementById("status");
  const resultCard = document.getElementById("result-card");
  const resultBody = document.getElementById("result-body");
  const exportBtn = document.getElementById("export");
  const exportPre = document.getElementById("export-json");

  // 判定阈值（06 路线图 §2.0 指标）
  const THRESHOLDS = {
    wasmCold: 4000,
    wasmHot: 1500,
    import10k: 2000, // 1 万行「导入 + 聚合」合计
    agg: 2000,
    memory: 400, // MB
  };

  let lastResult = null;

  /** 固定种子的伪随机数：保证每次生成的 CSV 形状一致，基准可复现 */
  function mulberry32(seed) {
    let a = seed >>> 0;
    return function () {
      a |= 0;
      a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  const CATEGORIES = [
    "餐饮", "交通", "购物", "娱乐", "居住", "通讯",
    "医疗", "教育", "人情", "金融", "订阅", "其他",
  ];
  const CHANNELS = ["wechat", "alipay", "manual"];

  /** 生成贴近真实账单形态的 CSV：小金额多笔、偶发大额、按类目分布 */
  function buildCsv(rowCount) {
    const rand = mulberry32(20261013);
    const lines = ["tx_id,date_iso,category,merchant,channel,direction,amount_cents"];
    for (let i = 0; i < rowCount; i++) {
      const cat = CATEGORIES[(rand() * CATEGORIES.length) | 0];
      // 金额按指数分布：多数落在 500~8000 分（5~80 元），长尾到数千元
      const cents = Math.round(500 + -Math.log(1 - rand()) * 3000);
      const month = 1 + ((rand() * 10) | 0);
      const day = 1 + ((rand() * 27) | 0);
      const date = `2026-${String(month).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
      const merchant = `商户${(rand() * 120) | 0}`;
      const channel = CHANNELS[(rand() * CHANNELS.length) | 0];
      const direction = rand() < 0.96 ? "expense" : "income";
      lines.push(`tx_${String(i).padStart(5, "0")},${date},${cat},${merchant},${channel},${direction},${cents}`);
    }
    return lines.join("\n");
  }

  /** 当前页冷加载耗时：导航开始到脚本执行 */
  function pageLoadMs() {
    return Math.round(performance.now());
  }

  function memoryMb() {
    if (performance.memory) return performance.memory.usedJSHeapSize / 1048576;
    return null; // 非 Chromium 内核读不到
  }

  function judge(ms, threshold) {
    return ms <= threshold ? ["pass", "通过"] : ["fail", "超标"];
  }

  function addRow(stage, ms, thresholdMs, verdictClass, verdictText) {
    const tr = document.createElement("tr");
    const msText = ms === null ? "—" : String(ms);
    const thresholdText = thresholdMs === null ? "—" : String(thresholdMs);
    tr.innerHTML = `
      <td>${stage}</td>
      <td class="num">${msText}</td>
      <td class="num">${thresholdText}</td>
      <td class="num ${verdictClass}">${verdictText}</td>`;
    resultBody.appendChild(tr);
  }

  async function runBenchmark() {
    runBtn.disabled = true;
    clearBtn.disabled = true;
    statusEl.textContent = "加载 WASM…";
    resultBody.innerHTML = "";
    resultCard.style.display = "block";
    exportPre.style.display = "none";

    const rowCount = Number(document.getElementById("rows").value);
    const pageLoadedAt = performance.now();
    const sessionKey = "spendct:spike:lastTotal";

    try {
      // —— 阶段 1：WASM 冷加载（含实例化） ——
      // 与 src/lib/duckdb 正式加载配置一致：mvp 包、禁用 pthread（07 契约 §8）
      const bundle = await duckdb.selectBundle({
        mvp: {
          mainModule: "/duckdb/duckdb-mvp.wasm",
          mainWorker: "/duckdb/duckdb-browser-mvp.worker.js",
        },
      });
      const worker = new Worker(bundle.mainWorker);
      const db = new duckdb.AsyncDuckDB(new duckdb.VoidLogger(), worker);
      const tInstantiate = performance.now();
      await db.instantiate(bundle.mainModule, null);
      const wasmLoadMs = Math.round(performance.now() - pageLoadedAt);

      // —— 阶段 2：生成 CSV 并注册为文件（内存缓冲，不落盘） ——
      const tCsv = performance.now();
      const csv = buildCsv(rowCount);
      db.registerFileText("bench.csv", csv);
      const csvMs = Math.round(performance.now() - tCsv);

      // —— 阶段 3：read_csv_auto 建表导入 ——
      const tImport = performance.now();
      const conn = await db.connect();
      await conn.query(
        "CREATE TABLE bench AS SELECT * FROM read_csv_auto('bench.csv', header = true)",
      );
      const importMs = Math.round(performance.now() - tImport);

      // —— 阶段 4：分组聚合（与六阶段画像 SQL 同形态） ——
      const tAgg = performance.now();
      const agg = await conn.query(
        "SELECT category, COUNT(*) AS cnt, SUM(amount_cents) AS total, AVG(amount_cents) AS avg " +
          "FROM bench GROUP BY category ORDER BY total DESC",
      );
      const aggRows = await agg.toArray();
      const aggMs = Math.round(performance.now() - tAgg);
      await conn.close();

      // —— 汇总与判定 ——
      const mem = memoryMb();
      const importAgg = importMs + aggMs;
      const hotLoadMs = Number(sessionStorage.getItem(sessionKey) || 0);
      const isHot = hotLoadMs > 0;

      const wasmThreshold = isHot ? THRESHOLDS.wasmHot : THRESHOLDS.wasmCold;
      const [wasmVerdict, wasmText] = judge(wasmLoadMs, wasmThreshold);
      // 1 万行档用「导入+聚合」合计指标，更大档只作参考
      const [importVerdict, importText] =
        rowCount === 10000 ? judge(importAgg, THRESHOLDS.import10k) : ["warn", "参考"];
      const [aggVerdict, aggText] = judge(aggMs, THRESHOLDS.agg);
      const [memVerdict, memText] =
        mem === null ? ["warn", "无法读取"] : judge(mem, THRESHOLDS.memory);

      addRow(`WASM 加载${isHot ? "（热）" : "（冷）"}`, wasmLoadMs, wasmThreshold, wasmVerdict, wasmText);
      addRow("CSV 生成+注册", csvMs, null, "warn", "参考");
      addRow("建表导入", importMs, null, "warn", "参考");
      addRow("分组聚合", aggMs, THRESHOLDS.agg, aggVerdict, aggText);
      addRow(`导入+聚合${rowCount === 10000 ? "（1 万行指标）" : "（参考）"}`, importAgg, rowCount === 10000 ? THRESHOLDS.import10k : null, importVerdict, importText);
      addRow("JS 堆内存（MB）", mem === null ? null : Math.round(mem * 10) / 10, THRESHOLDS.memory, memVerdict, memText);

      lastResult = {
        ts: new Date().toISOString(),
        ua: navigator.userAgent,
        rowCount,
        isHot,
        wasmLoadMs,
        csvMs,
        importMs,
        aggMs,
        importAggMs: importAgg,
        memoryMb: mem === null ? null : Math.round(mem * 10) / 10,
        aggRowCount: aggRows.length,
        totalAmount: aggRows.reduce((s, r) => s + Number(r.total), 0),
      };
      // 暴露给自动化脚本读取（scripts/run-spike-benchmark.mjs），页面本身不依赖
      window.__spikeResult = lastResult;
      sessionStorage.setItem(sessionKey, String(wasmLoadMs));
      statusEl.textContent = isHot ? "完成（热加载对比）" : "完成（冷加载）。刷新本页再测一次即为热加载。";
    } catch (err) {
      statusEl.textContent = "失败：" + (err && err.message ? err.message : String(err));
    } finally {
      runBtn.disabled = false;
      clearBtn.disabled = false;
    }
  }

  runBtn.addEventListener("click", runBenchmark);
  clearBtn.addEventListener("click", () => {
    sessionStorage.removeItem("spendct:spike:lastTotal");
    statusEl.textContent = "已清空热加载记录，下次测试按冷加载判定。";
  });
  exportBtn.addEventListener("click", async () => {
    if (!lastResult) return;
    const json = JSON.stringify(lastResult, null, 2);
    exportPre.textContent = json;
    exportPre.style.display = "block";
    try {
      await navigator.clipboard.writeText(json);
    } catch {
      // 剪贴板不可用时页面内仍展示了完整 JSON
    }
  });
</script>
</body>
</html>
